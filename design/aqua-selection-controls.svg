<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="860" height="500" viewBox="0 0 860 500" role="img" aria-labelledby="title description">
  <title id="title">AquaTimer 单选按钮与复选框</title>
  <desc id="description">根据 2005 年 Apple HIG 图 14-14 和 14-15 设计的单选按钮与复选框。展示未选、已选、按下、键盘聚焦及两种禁用状态，以及设置页的实际尺寸效果。</desc>
  <defs>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="2" height="2">
      <rect width="2" height="2" fill="#efefef"/>
      <path d="M0 0h2v1H0z" fill="#e9e9e9"/>
    </pattern>
    <linearGradient id="clearBody" gradientUnits="userSpaceOnUse" x2="0" y2="16.5">
      <stop offset="0" stop-color="#c3c8ce"/>
      <stop offset=".45" stop-color="#d5d9df"/>
      <stop offset=".66" stop-color="#e9ebed"/>
      <stop offset=".91" stop-color="#fff"/>
      <stop offset="1" stop-color="#fafafb"/>
    </linearGradient>
    <linearGradient id="clearCrown" gradientUnits="userSpaceOnUse" x2="0" y2="8">
      <stop offset="0" stop-color="#e6e9ec"/>
      <stop offset=".25" stop-color="#f9fafb"/>
      <stop offset="1" stop-color="#ecedf1"/>
    </linearGradient>
    <linearGradient id="blueBody" gradientUnits="userSpaceOnUse" x2="0" y2="16.5">
      <stop offset="0" stop-color="#456ba9"/>
      <stop offset=".44" stop-color="#579ad2"/>
      <stop offset=".7" stop-color="#79bfeb"/>
      <stop offset=".94" stop-color="#b5e6f6"/>
      <stop offset="1" stop-color="#a9dbe9"/>
    </linearGradient>
    <linearGradient id="blueCrown" gradientUnits="userSpaceOnUse" x2="0" y2="8">
      <stop offset="0" stop-color="#6386bd"/>
      <stop offset=".28" stop-color="#b4cdf0"/>
      <stop offset="1" stop-color="#8bb8e1"/>
    </linearGradient>
    <linearGradient id="pressedBody" gradientUnits="userSpaceOnUse" x2="0" y2="16.5">
      <stop offset="0" stop-color="#384b82"/>
      <stop offset=".45" stop-color="#3f7bbb"/>
      <stop offset=".78" stop-color="#69afe0"/>
      <stop offset="1" stop-color="#83c5e5"/>
    </linearGradient>
    <linearGradient id="pressedCrown" gradientUnits="userSpaceOnUse" x2="0" y2="8">
      <stop offset="0" stop-color="#5474ae"/>
      <stop offset=".28" stop-color="#92b4e4"/>
      <stop offset="1" stop-color="#719dd1"/>
    </linearGradient>
    <linearGradient id="clearEdge" gradientUnits="userSpaceOnUse" x2="0" y2="16.5">
      <stop offset="0" stop-color="#69737e"/>
      <stop offset=".45" stop-color="#9aa2a9"/>
      <stop offset="1" stop-color="#737d86"/>
    </linearGradient>
    <linearGradient id="blueEdge" gradientUnits="userSpaceOnUse" x2="0" y2="16.5">
      <stop offset="0" stop-color="#435c94"/>
      <stop offset=".5" stop-color="#5487b9"/>
      <stop offset="1" stop-color="#5d788a"/>
    </linearGradient>
    <linearGradient id="sideDepth" gradientUnits="userSpaceOnUse" x2="18" y2="0">
      <stop offset="0" stop-color="#2c5299" stop-opacity=".37"/>
      <stop offset=".22" stop-color="#2c5299" stop-opacity="0"/>
      <stop offset=".78" stop-color="#2c5299" stop-opacity="0"/>
      <stop offset="1" stop-color="#2c5299" stop-opacity=".37"/>
    </linearGradient>
    <linearGradient id="disabledBody" gradientUnits="userSpaceOnUse" x2="0" y2="16.5">
      <stop offset="0" stop-color="#f1f2f3"/>
      <stop offset=".47" stop-color="#e3e5e7"/>
      <stop offset=".9" stop-color="#f6f7f8"/>
    </linearGradient>
    <filter id="contactShadow" x="-20%" y="-20%" width="140%" height="145%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation=".48"/>
    </filter>
    <filter id="focusGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation=".61"/>
    </filter>
    <circle id="radioFace" cx="9" cy="8.45" r="7.8"/>
    <rect id="checkFace" x="1.25" y=".7" width="15.5" height="15.5" rx="1.8"/>
    <clipPath id="radioClip"><use xlink:href="#radioFace"/></clipPath>
    <clipPath id="checkClip"><use xlink:href="#checkFace"/></clipPath>
    <path id="radioReflection" d="M0 0H18V6.6C15.4 7.4 12.8 7.8 9 7.8S2.6 7.4 0 6.6Z"/>
    <path id="checkReflection" d="M0 0H18V7.2Q9 8.05 0 7.2Z"/>
    <circle id="dot" cx="9" cy="8.35" r="2.43"/>
    <path id="tick" d="M3.25 7.46 4.72 6.48 7.68 9.66Q11.4 4.02 17.48 -1.18L18.32 -.32Q12.72 5.38 8.82 12.45H7.04Z"/>
    <g id="radioOff">
      <use xlink:href="#radioFace" y="1.03" fill="#3b424c" opacity=".32" filter="url(#contactShadow)"/>
      <use xlink:href="#radioFace" fill="url(#clearBody)"/>
      <use xlink:href="#radioReflection" fill="url(#clearCrown)" clip-path="url(#radioClip)"/>
      <use xlink:href="#radioFace" fill="none" stroke="url(#clearEdge)" stroke-width=".82"/>
    </g>
    <g id="radioOn">
      <use xlink:href="#radioFace" y="1.03" fill="#323f58" opacity=".34" filter="url(#contactShadow)"/>
      <use xlink:href="#radioFace" fill="url(#blueBody)"/>
      <use xlink:href="#radioReflection" fill="url(#blueCrown)" clip-path="url(#radioClip)"/>
      <use xlink:href="#radioFace" fill="url(#sideDepth)" stroke="url(#blueEdge)" stroke-width=".82"/>
      <use xlink:href="#dot" fill="#18364b"/>
    </g>
    <g id="radioPressed">
      <use xlink:href="#radioFace" y=".78" fill="#28384f" opacity=".34" filter="url(#contactShadow)"/>
      <use xlink:href="#radioFace" fill="url(#pressedBody)"/>
      <use xlink:href="#radioReflection" fill="url(#pressedCrown)" clip-path="url(#radioClip)"/>
      <use xlink:href="#radioFace" fill="url(#sideDepth)" stroke="#465c88" stroke-width=".92"/>
      <use xlink:href="#dot" y=".15" fill="#152b43"/>
    </g>
    <g id="radioFocus">
      <circle cx="9" cy="8.45" r="9.25" fill="none" stroke="#61a9d7" stroke-width="1.85" opacity=".75" filter="url(#focusGlow)"/>
      <circle cx="9" cy="8.45" r="9.05" fill="none" stroke="#79b8df" stroke-width="1.35"/>
      <use xlink:href="#radioOn"/>
    </g>
    <g id="radioDisabledOff">
      <use xlink:href="#radioFace" fill="url(#disabledBody)" stroke="#b0b6be" stroke-width=".78"/>
    </g>
    <g id="radioDisabledOn">
      <use xlink:href="#radioDisabledOff"/>
      <use xlink:href="#dot" fill="#8b939d"/>
    </g>
    <g id="checkOff">
      <use xlink:href="#checkFace" y="1.02" fill="#3b424c" opacity=".34" filter="url(#contactShadow)"/>
      <use xlink:href="#checkFace" fill="url(#clearBody)"/>
      <use xlink:href="#checkReflection" fill="url(#clearCrown)" clip-path="url(#checkClip)"/>
      <use xlink:href="#checkFace" fill="none" stroke="url(#clearEdge)" stroke-width=".82"/>
    </g>
    <g id="checkOn">
      <use xlink:href="#checkFace" y="1.02" fill="#323f58" opacity=".34" filter="url(#contactShadow)"/>
      <use xlink:href="#checkFace" fill="url(#blueBody)"/>
      <use xlink:href="#checkReflection" fill="url(#blueCrown)" clip-path="url(#checkClip)"/>
      <use xlink:href="#checkFace" fill="url(#sideDepth)" stroke="url(#blueEdge)" stroke-width=".82"/>
      <use xlink:href="#tick" fill="#18364b"/>
    </g>
    <g id="checkPressed">
      <use xlink:href="#checkFace" y=".78" fill="#28384f" opacity=".34" filter="url(#contactShadow)"/>
      <use xlink:href="#checkFace" fill="url(#pressedBody)"/>
      <use xlink:href="#checkReflection" fill="url(#pressedCrown)" clip-path="url(#checkClip)"/>
      <use xlink:href="#checkFace" fill="url(#sideDepth)" stroke="#465c88" stroke-width=".92"/>
      <use xlink:href="#tick" y=".15" fill="#152b43"/>
    </g>
    <g id="checkFocus">
      <rect x="-.18" y="-.73" width="18.36" height="18.36" rx="3.23" fill="none" stroke="#61a9d7" stroke-width="1.85" opacity=".75" filter="url(#focusGlow)"/>
      <rect x=".02" y="-.53" width="17.96" height="17.96" rx="3.03" fill="none" stroke="#79b8df" stroke-width="1.35"/>
      <use xlink:href="#checkOn"/>
    </g>
    <g id="checkDisabledOff">
      <use xlink:href="#checkFace" fill="url(#disabledBody)" stroke="#b0b6be" stroke-width=".78"/>
    </g>
    <g id="checkDisabledOn">
      <use xlink:href="#checkDisabledOff"/>
      <use xlink:href="#tick" fill="#8b939d"/>
    </g>
  </defs>
  <rect width="860" height="500" fill="#fafafa"/>
  <g font-family="Lucida Grande, STXihei, STHeiti, sans-serif" fill="#272b31">
    <text x="32" y="42" font-size="24">单选按钮与复选框</text>
    <text x="828" y="41" font-size="12" fill="#59616a" text-anchor="end">18 × 18 pt · 含阴影</text>
    <rect x="32" y="66" width="796" height="226" fill="url(#stripes)"/>
    <g font-size="12" fill="#515963">
      <text x="52" y="96">4×</text>
      <text x="52" y="153">单选</text>
      <text x="52" y="251">复选</text>
      <g text-anchor="middle">
        <text x="174" y="96">未选中</text>
        <text x="289" y="96">已选中</text>
        <text x="404" y="96">按下待选</text>
        <text x="519" y="96">已选中 · 键盘聚焦</text>
        <text x="634" y="96">未选中 · 禁用</text>
        <text x="749" y="96">已选中 · 禁用</text>
      </g>
    </g>
    <use xlink:href="#radioOff" transform="translate(138 117) scale(4)"/>
    <use xlink:href="#radioOn" transform="translate(253 117) scale(4)"/>
    <use xlink:href="#radioPressed" transform="translate(368 117) scale(4)"/>
    <use xlink:href="#radioFocus" transform="translate(483 117) scale(4)"/>
    <use xlink:href="#radioDisabledOff" transform="translate(598 117) scale(4)"/>
    <use xlink:href="#radioDisabledOn" transform="translate(713 117) scale(4)"/>
    <use xlink:href="#checkOff" transform="translate(138 215) scale(4)"/>
    <use xlink:href="#checkOn" transform="translate(253 215) scale(4)"/>
    <use xlink:href="#checkPressed" transform="translate(368 215) scale(4)"/>
    <use xlink:href="#checkFocus" transform="translate(483 215) scale(4)"/>
    <use xlink:href="#checkDisabledOff" transform="translate(598 215) scale(4)"/>
    <use xlink:href="#checkDisabledOn" transform="translate(713 215) scale(4)"/>

    <text x="32" y="324" font-size="12" fill="#515963">偏好设置 · 1×</text>
    <rect x="32" y="336" width="796" height="104" fill="url(#stripes)"/>
    <path d="M430 352v72" stroke="#d3d4d6" stroke-width="1"/>
    <g font-size="13">
      <text x="64" y="377">启动时长：</text>
      <use xlink:href="#radioOn" x="137" y="364"/>
      <text x="160" y="377">使用固定时长</text>
      <use xlink:href="#radioOff" x="137" y="388"/>
      <text x="160" y="401">记住上次设定的时长</text>
      <text x="455" y="377">提醒：</text>
      <use xlink:href="#checkOn" x="502" y="364"/>
      <text x="525" y="377">到时播放提示音</text>
      <use xlink:href="#checkOff" x="502" y="390"/>
      <text x="525" y="403">后台到时发送系统通知</text>
    </g>
    <text x="32" y="475" font-size="11" fill="#59616a">Apple Human Interface Guidelines（2005）第 235–237 页 · 图 14-14、14-15</text>
  </g>
</svg>
