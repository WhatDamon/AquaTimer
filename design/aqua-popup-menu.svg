<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="548" viewBox="0 0 900 548" role="img" aria-labelledby="title description">
  <title id="title">AquaTimer 下拉选择器样稿</title>
  <desc id="description">参照 2005 年 Apple HIG 图 14-20 与 14-21。灰白玻璃按钮配蓝色端帽和上下双三角。菜单展开后，当前项对齐收起时的文字并带勾号。包含四种状态、两倍材质细节和提醒页原尺寸示例。</desc>
  <defs>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="2" height="2">
      <rect width="2" height="2" fill="#efefef"/>
      <path d="M0 0h2v1H0z" fill="#e9e9e9"/>
    </pattern>
    <pattern id="menuStripes" patternUnits="userSpaceOnUse" width="2" height="2">
      <rect width="2" height="2" fill="#f5f5f5"/>
      <path d="M0 0h2v1H0z" fill="#efefef"/>
    </pattern>
    <linearGradient id="clearBody" gradientUnits="userSpaceOnUse" x2="0" y2="20">
      <stop offset="0" stop-color="#bec1c4"/>
      <stop offset=".435" stop-color="#d9dbe0"/>
      <stop offset=".68" stop-color="#eff0f3"/>
      <stop offset=".88" stop-color="#fdfdfe"/>
    </linearGradient>
    <linearGradient id="clearReflection" gradientUnits="userSpaceOnUse" x2="0" y2="20">
      <stop offset="0" stop-color="#e5e6e8"/>
      <stop offset=".075" stop-color="#fafafb"/>
      <stop offset=".24" stop-color="#eff0f2"/>
      <stop offset=".43" stop-color="#eeeff1"/>
    </linearGradient>
    <linearGradient id="blueBody" gradientUnits="userSpaceOnUse" x2="0" y2="20">
      <stop offset="0" stop-color="#657fa5"/>
      <stop offset=".435" stop-color="#78b3dd"/>
      <stop offset=".72" stop-color="#9ad4ee"/>
      <stop offset=".94" stop-color="#b7e4f0"/>
    </linearGradient>
    <linearGradient id="blueReflection" gradientUnits="userSpaceOnUse" x2="0" y2="20">
      <stop offset="0" stop-color="#8da4c4"/>
      <stop offset=".075" stop-color="#bdd2ee"/>
      <stop offset=".24" stop-color="#abccea"/>
      <stop offset=".42" stop-color="#92c5e9"/>
    </linearGradient>
    <linearGradient id="clearEdge" gradientUnits="userSpaceOnUse" x2="0" y2="20">
      <stop offset="0" stop-color="#777e85"/>
      <stop offset=".47" stop-color="#a0a6ad"/>
      <stop offset="1" stop-color="#747c83"/>
    </linearGradient>
    <linearGradient id="blueEdge" gradientUnits="userSpaceOnUse" x2="0" y2="20">
      <stop offset="0" stop-color="#475477"/>
      <stop offset=".47" stop-color="#5c88b1"/>
      <stop offset="1" stop-color="#697f87"/>
    </linearGradient>
    <linearGradient id="seam" gradientUnits="userSpaceOnUse" x2="0" y2="20">
      <stop offset="0" stop-color="#607ca3" stop-opacity=".52"/>
      <stop offset=".5" stop-color="#6287a9" stop-opacity=".6"/>
      <stop offset="1" stop-color="#617e8b" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="disabledBody" gradientUnits="userSpaceOnUse" x2="0" y2="20">
      <stop offset="0" stop-color="#f4f5f6"/>
      <stop offset=".48" stop-color="#e5e7e9"/>
      <stop offset=".92" stop-color="#f5f5f6"/>
    </linearGradient>
    <linearGradient id="selection" x2="0" y2="1">
      <stop offset="0" stop-color="#487ec7"/>
      <stop offset="1" stop-color="#3164ab"/>
    </linearGradient>
    <filter id="controlShadow" x="-10%" y="-25%" width="120%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation=".65"/>
    </filter>
    <!-- Match the window's broad cast shadow and tight contact shadow at menu scale. -->
    <filter id="menuCastShadow" x="-15%" y="-30%" width="130%" height="175%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4.8"/>
    </filter>
    <filter id="menuContactShadow" x="-10%" y="-15%" width="120%" height="135%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.45"/>
    </filter>
    <filter id="focusGlow" x="-10%" y="-25%" width="120%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation=".65"/>
    </filter>
    <rect id="face" x=".5" y=".5" width="189" height="19" rx="4.25"/>
    <clipPath id="faceClip"><use xlink:href="#face"/></clipPath>
    <clipPath id="capClip"><rect x="170" width="20" height="20"/></clipPath>
    <path id="reflection" d="M0 0H190V7.1C188 8.4 185 8.6 178 8.6H12C5 8.6 2 8.4 0 7.1Z"/>
    <path id="arrows" d="M176.7 8.65 180 4.75 183.3 8.65Z M176.7 11.35H183.3L180 15.25Z"/>
    <g id="closed">
      <rect x="1.2" y="2" width="187.6" height="18.5" rx="4.1" fill="#38434d" opacity=".25" filter="url(#controlShadow)"/>
      <g clip-path="url(#faceClip)">
        <rect width="190" height="20" fill="url(#clearBody)"/>
        <use xlink:href="#reflection" fill="url(#clearReflection)"/>
        <g clip-path="url(#capClip)">
          <rect x="170" width="20" height="20" fill="url(#blueBody)"/>
          <use xlink:href="#reflection" fill="url(#blueReflection)"/>
        </g>
        <path d="M170 .5v19" stroke="url(#seam)" stroke-width=".75"/>
      </g>
      <use xlink:href="#face" fill="none" stroke="url(#clearEdge)"/>
      <use xlink:href="#face" fill="none" stroke="url(#blueEdge)" clip-path="url(#capClip)"/>
      <use xlink:href="#arrows" fill="#203b58"/>
    </g>
    <g id="focus">
      <rect x="-1.5" y="-1.5" width="193" height="23" rx="6" fill="none" stroke="#61a9d7" stroke-width="2.35" opacity=".7" filter="url(#focusGlow)"/>
      <rect x="-1.15" y="-1.15" width="192.3" height="22.3" rx="5.55" fill="none" stroke="#83bcdf" stroke-width="1.45"/>
      <use xlink:href="#closed"/>
    </g>
    <g id="disabled">
      <use xlink:href="#face" fill="url(#disabledBody)" stroke="#b6bac1"/>
      <path d="M170 1v18" stroke="#bfc5cb" opacity=".75" stroke-width=".75"/>
      <use xlink:href="#arrows" fill="#9ca4ad"/>
    </g>
    <path id="menuCheck" d="M3.25 7.46 4.72 6.48 7.68 9.66Q11.4 4.02 17.48 -1.18L18.32 -.32Q12.72 5.38 8.82 12.45H7.04Z"/>
    <rect id="menuFace" x="-11.5" y="-22.5" width="182" height="65"/>
    <g id="openTone" font-family="Lucida Grande, STXihei, STHeiti, sans-serif" font-size="13">
      <use xlink:href="#closed"/>
      <!-- The current row overlaps the value field, leaving the arrow cap exposed. -->
      <use xlink:href="#menuFace" y="4.2" fill="#000" opacity=".42" filter="url(#menuCastShadow)"/>
      <use xlink:href="#menuFace" y="1.3" fill="#000" opacity=".29" filter="url(#menuContactShadow)"/>
      <use xlink:href="#menuFace" fill="url(#menuStripes)" stroke="#bfc3c7" stroke-width=".7"/>
      <rect x="-11" width="181" height="20" fill="url(#selection)"/>
      <text x="9" y="-5.7" fill="#23262b">玻璃音（Glass）</text>
      <use xlink:href="#menuCheck" transform="translate(-9.4 6.3) scale(.66)" fill="#fff"/>
      <text x="9" y="14.3" fill="#fff">清脆提示（Ping）</text>
      <text x="9" y="34.3" fill="#23262b">潜水提示（Submarine）</text>
    </g>
  </defs>
  <rect width="900" height="548" fill="#fafafa"/>
  <g font-family="Lucida Grande, STXihei, STHeiti, sans-serif" fill="#252930" font-size="13">
    <text x="32" y="43" font-size="24">Aqua 下拉选择器</text>
    <text x="868" y="41" font-size="12" text-anchor="end" fill="#59616a">190 × 20 pt</text>

    <rect x="32" y="66" width="836" height="198" fill="url(#stripes)"/>
    <g text-anchor="middle" fill="#515963" font-size="12">
      <text x="239" y="102">收起 · 2×</text>
      <text x="661" y="102">展开 · 2×</text>
    </g>
    <g transform="translate(49 170) scale(2)">
      <use xlink:href="#closed"/>
      <text x="9" y="14.3">玻璃音（Glass）</text>
    </g>
    <use xlink:href="#openTone" transform="translate(472 170) scale(2)"/>

    <rect x="32" y="283" width="836" height="76" fill="url(#stripes)"/>
    <g text-anchor="middle" fill="#515963" font-size="11">
      <text x="175" y="342">正常 · 1×</text>
      <text x="450" y="342">键盘聚焦</text>
      <text x="725" y="342">禁用</text>
    </g>
    <g transform="translate(80 300)">
      <use xlink:href="#closed"/>
      <text x="9" y="14.3">玻璃音（Glass）</text>
    </g>
    <g transform="translate(355 300)">
      <use xlink:href="#focus"/>
      <text x="9" y="14.3">播放三次</text>
    </g>
    <g transform="translate(630 300)">
      <use xlink:href="#disabled"/>
      <text x="9" y="14.3" fill="#8b9098">玻璃音（Glass）</text>
    </g>

    <text x="32" y="393" fill="#515963" font-size="12">提醒设置 · 1×</text>
    <rect x="32" y="407" width="836" height="92" fill="url(#stripes)"/>
    <g transform="translate(141 427)">
      <text x="-8" y="14.3" text-anchor="end">提示音：</text>
      <use xlink:href="#closed"/>
      <text x="9" y="14.3">玻璃音（Glass）</text>
      <rect x="198.5" y=".5" width="67" height="19" rx="9.5" fill="url(#clearBody)" stroke="url(#clearEdge)"/>
      <text x="232" y="14.3" text-anchor="middle">试听</text>
      <text x="-8" y="44.3" text-anchor="end">播放次数：</text>
      <use xlink:href="#closed" y="30"/>
      <text x="9" y="44.3">播放三次</text>
    </g>
    <text x="32" y="528" font-size="11" fill="#59616a">Apple Human Interface Guidelines（2005）第 241–244 页 · 图 14-20、14-21</text>
  </g>
</svg>
