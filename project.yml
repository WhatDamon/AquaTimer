name: AquaTimer
options:
  developmentLanguage: zh-Hans
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
targets:
  AquaTimer:
    type: application
    platform: macOS
    sources:
      - path: AquaTimer
        excludes:
          - Resources/Info.plist
          - Resources/AquaTimer.entitlements
          - Resources/Fonts
          - Resources/AppIcon.icon
      - path: AquaTimer/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: AquaTimer/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aquatimer.AquaTimer
        PRODUCT_NAME: AquaTimer
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AquaTimer/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: AquaTimer/Resources/AquaTimer.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AquaTimerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AquaTimerTests
      - path: AquaTimer/Timer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aquatimer.AquaTimerTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AquaTimer:
    build:
      targets:
        AquaTimer: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AquaTimerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

